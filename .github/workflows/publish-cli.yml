# Publica el CLI `forjabot` a npm con PROCEDENCIA (provenance), usando
# Trusted Publishing: npm confía en este repositorio vía OIDC, así que NO hay
# ningún token guardado en GitHub. Nada que robar, nada que rotar.
#
# Provenance = npm firma el paquete con Sigstore y deja constancia pública de
# QUÉ commit de ESTE repo lo construyó. En npmjs.com aparece el badge
# "Provenance" enlazando al commit y a la corrida que lo publicó.
#
# Configuración previa (una sola vez, en npmjs.com):
#   Paquete forjabot → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: santmun
#     Repository:           forja
#     Workflow filename:    publish-cli.yml
#
# Cómo se dispara: a mano desde la pestaña Actions, o al publicar un release.
name: Publicar CLI en npm

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # imprescindible: es lo que prueba ante npm quién publica
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing necesita npm 11.5.1 o superior.
      - name: Actualizar npm
        run: npm install -g npm@latest

      # El CLI no tiene dependencias: no hay install que hacer. Solo validamos
      # que el archivo que se va a publicar sea JavaScript sintácticamente sano.
      - name: Revisar el CLI
        working-directory: cli
        run: node --check bin/cli.js

      # Sin NODE_AUTH_TOKEN: npm obtiene la credencial del propio OIDC de
      # GitHub y añade la procedencia automáticamente.
      - name: Publicar
        working-directory: cli
        run: npm publish --access public
