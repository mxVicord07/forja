# Member replaces {{BOT_SLUG}} via the skill /configurar-mi-chatbot.
# DO NOT commit member-specific values to git.

name = "birevx-support-bot"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "AGENT"
class_name = "SupportAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SupportAgent"]

[[d1_databases]]
binding = "DB"
database_name = "horizontes_bot_db"
database_id = "e67b7241-4bbf-45f1-9a20-156163a01e7b"

[[vectorize]]
binding = "KB"
index_name = "horizontes_bot_kb"

[[r2_buckets]]
binding = "CATALOG"
bucket_name = "horizontes-bot-catalog-birevx-support-bot"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "horizontes-bot-media-birevx-support-bot"

[vars]
BOT_NAME = "BIRevX Support Bot"
BUSINESS_NAME = "BIRevX — Agencia de Automatizacion IA"
BOT_LANGUAGE = "es"
BOT_TIER = "pro"
BUFFER_SECONDS = "15"
DASHBOARD_BASE_URL = "https://birevx-support-bot.victor-m-426.workers.dev"
WA_PROVIDER = "ycloud"
YCLOUD_WA_FROM = "+524444237875"

# Canal interno del equipo (decisions.md, entrada 2026-09-24): Telegram es
# exclusivo del equipo BIRevX en este bot — nunca se le da a un cliente.
# Confirmado 2026-09-25: los 4 contactos que ya habían escrito por Telegram
# antes de activar esto eran pruebas del propio Victor, ninguno era cliente.
INTERNAL_CHANNEL = "telegram"

# Cal.com (agenda real — scheduleAppointment/checkAvailability). Event type
# "diagnostico" (https://cal.com/birevx/diagnostico), único servicio agendable
# hoy. CALCOM_API_KEY va como secret (wrangler secret put), nunca acá.
CALCOM_EVENT_TYPE_ID = "5027054"
# Hallazgo real 20-sep-2026: el event type tiene DOS ubicaciones configuradas
# (dirección del cliente + Office 365 video) — sin decirle a Cal.com cuál usar,
# el booking falla con 400 pidiendo la dirección. El bot promete "100% remoto
# por videoconferencia", así que forzamos la de video.
CALCOM_LOCATION = '{"type":"integration","integration":"office365-video"}'

# Optional egress (ticket 7E5F40): Worker→Anthropic/Zernio 400 vacío.
#   AGENT_LOCATION_HINT = "wnam"   # pin DOs near US (only on FIRST create)
#   ANTHROPIC_BASE_URL = "https://gateway.ai.cloudflare.com/v1/<account>/<gw>/anthropic"
#   CF_AIG_TOKEN               secret — AI Gateway (cf-aig-authorization)
#
# Modo Demo (skill /demo, Modo Agencia) — chat web SIN autenticar en /demo
# para enseñarle el bot a un prospecto. OFF por default; solo prender en una
# instancia DESECHABLE del prospecto, nunca en un bot de cliente real:
#   DEMO_MODE = "on"
#
# Secrets (set with `wrangler secret put <NAME>` — never commit values):
#   LEAD_EXPORT_WEBHOOK_URL    optional — webhook de n8n que hace el upsert del lead
#                              en Odoo. Vivia aqui en [vars] hasta 2026-08-19, pero
#                              [vars] SE COMMITEA y este fork es publico: la URL
#                              quedaba expuesta y el endpoint no autentica nada, o
#                              sea que cualquiera podia inyectar leads en el CRM.
#                              Ahora es secret, con ruta no adivinable.
#                              set con: wrangler secret put LEAD_EXPORT_WEBHOOK_URL
#   ANTHROPIC_API_KEY          required — Claude API
#   DASHBOARD_PASSWORD         required (Pro) — HTTP Basic Auth for /admin (user: admin)
#   KB_REINDEX_TOKEN           required — guards POST /kb/reindex (header: X-Reindex-Token)
#                              set with: wrangler secret put KB_REINDEX_TOKEN
#   TELEGRAM_BOT_TOKEN         per-channel — Telegram bot
#   MANYCHAT_API_KEY           per-channel — ManyChat (Pro)
#   TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_WA_FROM   per-channel — Twilio WhatsApp (Pro)
#   CALCOM_API_KEY             optional — scheduleAppointment (Pro)
#   GOOGLE_SERVICE_ACCOUNT_JSON  optional — Sheets export (Pro)
#   RESEND_API_KEY             optional — handoff email
#   OWNER_EMAIL                handoff email recipient
#   OWNER_TELEGRAM_CHAT_ID     handoff notification (default channel — owner /start's the bot)
#   OWNER_WA_NUMBER            handoff WhatsApp DM recipient (Pro)
#   TWILIO_HANDOFF_CONTENT_SID approved WhatsApp template SID for the handoff DM (Pro)
#   CONTROL_PLANE_TOKEN        optional (secret) — Bearer the hosted control plane presents to call /api/*
#                              set with: wrangler secret put CONTROL_PLANE_TOKEN
#   CONTROL_PLANE_URL          optional (var) — base URL of the control plane (future reports / license check)

[triggers]
# AGREGA ticks aquí si los necesitas, pero NO quites "0 3 * * *": los trabajos
# nocturnos (purga, insights, flywheel, reporte al dueño) solo corren en ese tick
# — ver DAILY_CRON en src/crons/schedule.ts. Sin él dejan de correr en silencio.
crons = [
  "0 3 * * *",  # daily 3am UTC: purge old messages + nightly analysis/reports (DAILY_CRON)
  "0 * * * *",  # hourly: evalúa ventanas de follow-up/outreach/reengage a tiempo (2026-08-20)
]

# DASHBOARD_PASSWORD  (secret) — HTTP Basic Auth password for the admin dashboard; username is always "admin".
# Set it with: wrangler secret put DASHBOARD_PASSWORD
